<html>
    <head>
        <title>YOUR-SITE-NAME</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="./assets/css/style.css" />

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=link_2" />

        <!-- コードハイライトライブラリのセットアップ(Prism) -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.css" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/toolbar/prism-toolbar.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>

        <script lang="javascript" type="module">
            import fetchMetaData from "./assets/services/fetchMetaData.js";      // メタデータ取得関数
            import marked from "./assets/services/marked.js"                     // カスタムしたmarked.js

            // ページのリスト表示コンポーネント
            import PageListElement     from "./assets/elements/PageList/PageList.js"
            import PageListItemElement from "./assets/elements/PageList/PageListItem.js"
            import IconListItemElement from "./assets/elements/PageList/IconListItem.js"

            import HeaderElement       from "./assets/elements/Header/Header.js"    // ヘッダーコンポーネント
            import RelatedElement      from "./assets/elements/Related/Related.js"  // 関連記事コンポーネント
            import FooterElement       from "./assets/elements/Footer/Footer.js"    // フッターコンポーネント

            import PageElement         from "./assets/elements/pages/Page.js"       // 各Markdownの内容を表示するコンポーネント
            import IndexPageElement    from "./assets/elements/pages/IndexPage.js"  // 記事の指定がない場合に表示するコンポーネント
            import NotFoundPageElement from "./assets/elements/pages/Error/NotFoundPage.js"     // 未作成の記事のリンクが押されたときに表示するコンポーネント
            import ErrorPageElement    from "./assets/elements/pages/Error/ErrorPage.js"        // その他エラーが発生した際に表示するコンポーネント

            // カスタム要素の登録
            customElements.define("custom-page-list", PageListElement);
            customElements.define("custom-page-list-item", PageListItemElement);
            customElements.define("custom-icon-list-item", IconListItemElement);

            customElements.define("custom-header", HeaderElement);
            customElements.define("custom-related", RelatedElement);
            customElements.define("custom-footer", FooterElement);

            customElements.define("custom-page", PageElement);
            customElements.define("custom-page-index", IndexPageElement);
            customElements.define("custom-page-404", NotFoundPageElement);
            customElements.define("custom-page-error", ErrorPageElement);


            // メタデータは初回アクセス時に非同期で取得を開始する。
            const metadataPromise = fetchMetaData();
            // キャンセル用
            let abortController = null;

            // ページ表示更新処理をイベントリスナに登録
            for (const eventName of ["load", "hashchange"]) {
                window.addEventListener(eventName, async () => {
                    // 実行中のリクエストがあればキャンセル
                    if (abortController) abortController.abort();
                    abortController = new AbortController();

                    const name = decodeURIComponent(window.location.hash.substring(1));
                    const pageContainer = document.getElementById("page");
                    const related = document.querySelector("custom-related");

                    try {
                        const metadata = await metadataPromise;
                        let displayElement;

                        if (!name) {
                            // ページの指定がない場合
                            displayElement = new IndexPageElement();
                            displayElement.init(metadata);
                            displayElement.sortby = "created"
                        } else {
                            // Markdown取得
                            const response = await fetch(`pages/${name}.md`, { signal: abortController.signal });

                            if (!response.ok) {
                                if (response.status === 404) {
                                    displayElement = new NotFoundPageElement();
                                } else {
                                    displayElement = new ErrorPageElement();
                                    displayElement.status = response.status;
                                }
                            } else {
                                const text = await response.text();
                                displayElement = new PageElement();
                                displayElement.innerHTML = marked.parse(text);
                            }
                        }

                        // DOM更新
                        pageContainer.replaceChildren(displayElement);
                        related.update(name, metadata);

                        // ハイライト適用とスクロール
                        Prism.highlightAll();
                        window.scrollTo(0, 0);

                    } catch (e) {
                        if (e.name === 'AbortError') return; // キャンセル時は何もしない

                        console.error(e);
                        const errorPage = new ErrorPageElement();
                        errorPage.status = e.message;
                        pageContainer.replaceChildren(errorPage);
                    }
                });
            }
        </script>
    </head>
    <body>
        <custom-header>YOUR-SITE-NAME</custom-header>
        <main id="main">
            <article id="page">
                <!-- ここに markdown の内容が表示される -->
                Now Loading...
            </article>
            <hr>
            <custom-related></custom-related>
        </main>
        <custom-footer></custom-footer>
    </body>
</html>
